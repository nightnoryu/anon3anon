services:
  anon3anon:
    environment:
      # Token for your bot, obtained from t.me/BotFather
      ANON3ANON_TELEGRAM_BOT_TOKEN: "123:ABC"
      # Key that pseudonymizes sender identifiers in the database. Generate one
      # with `openssl rand -base64 32`. Changing it orphans every session,
      # block, and relay already stored, so keep it stable per database.
      ANON3ANON_PSEUDONYM_KEY: "generate-me-with-openssl-rand-base64-32"
