services:
  anon3anon:
    container_name: anon3anon
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ANON3ANON_ALLOWED_USER_IDS: ""
      ANON3ANON_DATABASE_PATH: /data/anon3anon.db
      ANON3ANON_RATE_LIMIT_WINDOW: "1h"
      ANON3ANON_RATE_LIMIT_MAX: "100"
      ANON3ANON_HEALTH_ADDR: ":8080"
    volumes:
      - "./bin:/app/bin"
      - "anon3anon-data:/data"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  anon3anon-data:
