apiVersion: apps/v1
kind: Deployment
metadata:
  name: anon3anon
  namespace: anon3anon
  labels:
    app: anon3anon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anon3anon
  template:
    metadata:
      labels:
        app: anon3anon
    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      initContainers:
        - name: warp
          image: caomingjun/warp:latest
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          ports:
            - name: warp-proxy
              containerPort: 1080
          env:
            - name: WARP_SLEEP
              value: "2"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: warp-data
              mountPath: /var/lib/cloudflare-warp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "curl -sf --max-time 5 -x socks5h://127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'"
            initialDelaySeconds: 5
            periodSeconds: 15
      containers:
        - name: anon3anon
          image: ghcr.io/nightnoryu/anon3anon:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: ANON3ANON_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anon3anon-secrets
                  key: ANON3ANON_TELEGRAM_BOT_TOKEN
            - name: ANON3ANON_ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: anon3anon-secrets
                  key: ANON3ANON_ALLOWED_USER_IDS
                  optional: true
            - name: ANON3ANON_DATABASE_PATH
              value: /data/anon3anon.db
            - name: ANON3ANON_RATE_LIMIT_WINDOW
              valueFrom:
                configMapKeyRef:
                  name: anon3anon-config
                  key: ANON3ANON_RATE_LIMIT_WINDOW
            - name: ANON3ANON_RATE_LIMIT_MAX
              valueFrom:
                configMapKeyRef:
                  name: anon3anon-config
                  key: ANON3ANON_RATE_LIMIT_MAX
            - name: ANON3ANON_HEALTH_ADDR
              value: ":8080"
            - name: HTTP_PROXY
              value: socks5://127.0.0.1:1080
            - name: HTTPS_PROXY
              value: socks5://127.0.0.1:1080
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anon3anon-data
        - name: warp-data
          emptyDir: {}
