apiVersion: apps/v1
kind: Deployment
metadata:
  name: anon3anon
  namespace: anon3anon
  labels:
    app: anon3anon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anon3anon
  template:
    metadata:
      labels:
        app: anon3anon
    spec:
      containers:
        - name: anon3anon
          image: ghcr.io/nightnoryu/anon3anon:latest
          imagePullPolicy: Always
          env:
            - name: ANON3ANON_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anon3anon-secrets
                  key: ANON3ANON_TELEGRAM_BOT_TOKEN
            - name: ANON3ANON_ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: anon3anon-secrets
                  key: ANON3ANON_ALLOWED_USER_IDS
                  optional: true
            - name: ANON3ANON_DATABASE_PATH
              value: /data/anon3anon.db
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anon3anon-data
