[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
sops = "3.13.3"
age = "1.3.2"
ksops = "4.5.1"
kustomize = "5.8.3"
kubectl = "1.37.0"
kubeconform = "0.8.0"

[env]
GOOS = "linux"
GOARCH = "amd64"
CGO_ENABLED = "0"

[tasks.default]
run = [
    { task = "build" },
    { task = "check" },
]

# Local environment

[tasks.dev]
depends = [ "build" ]
run = "docker compose up -d --wait"

[tasks."dev:reload"]
depends = [ "build" ]
run = "docker compose restart anon3anon"

[tasks."dev:down"]
run = "docker compose down"

[tasks."dev:ps"]
run = "docker compose ps"

[tasks."dev:logs"]
run = "docker compose logs -f"

# Build

[tasks.tidy]
run = "go mod tidy"

[tasks.modules]
run = "go mod download"
sources = [ "go.*" ]
outputs = { auto = true }

[tasks.build]
depends = [ "modules" ]
run = "go build -o ./bin/anon3anon ./cmd/anon3anon"
sources = [
    "**/*.go",
    "go.*",
]
outputs = [ "bin/anon3anon" ]

# Deployment

[tasks.secrets]
run = "sops k8s/prod/secret.enc.yaml"

[tasks.deploy]
confirm = { message = "Deploy to production?", yes = "Deploy", no = "Cancel", default = "no" }
run = """
kustomize build --enable-alpha-plugins --enable-exec k8s/prod | kubectl apply -f -
kubectl rollout restart deployment/anon3anon -n anon3anon
kubectl rollout status deployment/anon3anon -n anon3anon --timeout=300s
"""

# Checks

[tasks.check]
depends = [ "test:unit", "lint" ]

[tasks."test:unit"]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks."k8s:lint"]
run = """
set -e
rendered=$(mktemp)
trap 'rm -f "$rendered"' EXIT
kubectl kustomize k8s/base > "$rendered"
kubeconform -strict -summary -ignore-missing-schemas "$rendered"
"""
sources = [ "k8s/base/**/*" ]
