[tools]
go = "1.26"
golangci-lint = "2.12.2"

[env]
GOOS = "linux"
GOARCH = "amd64"
CGO_ENABLED = "0"

[tasks.default]
run = [
    { task = "build" },
    { task = "check" },
]

# Local environment

[tasks.dev]
depends = [ "build" ]
run = "docker compose up -d --wait"

[tasks."dev:reload"]
depends = [ "build" ]
run = "docker compose restart anon3anon"

[tasks."dev:down"]
run = "docker compose down"

[tasks."dev:ps"]
run = "docker compose ps"

[tasks."dev:logs"]
run = "docker compose logs -f"

# Build

[tasks.tidy]
run = "go mod tidy"

[tasks.modules]
run = "go mod download"

[tasks.build]
depends = [ "modules" ]
run = "go build -trimpath -v -o ./bin/anon3anon ./cmd/anon3anon"

# Checks

[tasks.check]
depends = [ "lint", "test:unit" ]

[tasks.lint]
run = "golangci-lint run"

[tasks."test:unit"]
run = "go test ./..."
